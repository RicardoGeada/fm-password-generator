<div class="password-display">
  <output class="password-display__output" aria-label="Generated password" aria-live="polite">
    @if (ps.password()) {
      {{ ps.password() }}
    } @else {
      <span class="placeholder" aria-hidden="true">P4$5W0rD!</span>
      <span class="sr-only">No password generated yet</span>
    }
  </output>
  <button
    class="password-display__button"
    (click)="copyPassword()"
    [disabled]="!ps.password()"
    aria-label="Copy password"
  >
    <span>{{ copied() ? 'COPIED' : '' }}</span>
    <!-- Screen Reader -->
    <span class="sr-only" role="status">
      {{ copied() ? 'Password copied to clipboard' : '' }}
    </span>
    <img src="./assets/images/icon-copy.svg" alt="" />
  </button>
</div>
