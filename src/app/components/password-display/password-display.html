<div class="password-display">
    <input class="password-display__input" type="text" placeholder="P4$5W0rD!" [value]="ps.password()" readonly>   
    <button class="password-display__button" (click)="copyPassword()" [disabled]="!ps.password()">
        <span>{{ copied() ? "COPIED" : "" }}</span>
        <img src="./assets/images/icon-copy.svg" alt="copy">
    </button>
</div>
